# The allow-list `egress: registries` really means: what a lab job may fetch.

# Every entry is a place arbitrary code from a pull request can download from, so keep it to registries and
# dependency mirrors. Run with: squid -k parse -C /etc/squid/squid.conf && squid

http_port 3128

acl SSL_ports port 443
acl Safe_ports port 80 443

acl allowed_hosts ssl::server_name \
  registry-1.docker.io \
  auth.docker.io \
  index.docker.io \
  production.cloudflare.docker.com \
  ghcr.io \
  quay.io \
  proxy.golang.org \
  sum.golang.org \
  github.com \
  codeload.github.com \
  objects.githubusercontent.com \
  raw.githubusercontent.com \
  pypi.org \
  files.pythonhosted.org \
  registry.npmjs.org \
  dl-cdn.alpinelinux.org \
  deb.debian.org \
  archive.ubuntu.com

http_access allow CONNECT allowed_hosts
http_access allow GET allowed_hosts
http_access deny all

# No caching. A later review should resolve dependencies the same way the first one did, rather than
# answering from a cache an earlier review warmed.
cache deny all
request_body_max_size 20 MB
