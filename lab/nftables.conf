# Egress ceiling for the lab, keyed on the user the daemon runs as.

# `egress: registries` tells the container to use the proxy; this is the part that makes ignoring that
# advice impossible. Direct outbound from the lab user is refused, and only the proxy and DNS pass.
# Apply with: nft -f lab/nftables.conf
#
# What this is not: it is not a per-container policy. It keys on the socket owner, which is the lab user
# for rootless podman's pasta/slirp path, and it constrains nothing else on the box. Tightening it to one
# network namespace per job is what the micro-VM tier would buy.

table inet laidback_lab {
  chain output {
    type filter hook output priority filter; policy accept;

    meta skuid "lab" oifname "lo" accept
    meta skuid "lab" udp dport 53 accept
    meta skuid "lab" tcp dport 3128 accept
    meta skuid "lab" reject with icmpx type admin-prohibited
  }
}
