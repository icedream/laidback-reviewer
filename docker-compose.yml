services:
  reviewer:
    build: .
    container_name: laidback-reviewer
    user: ${UID:-1000}:${GID:-1000}
    restart: unless-stopped
    env_file:
      - .env
    # Nothing from the host environment leaks in beyond .env. The git credential helper reads
    # LAIDBACK_GH_TOKEN at call time, so the token is never written into a config file.
    environment:
      - UID
      - GID
      - LAIDBACK_CONFIG=/app/config.yaml
      - LAIDBACK_STATE_DB=/data/state.db
      - LAIDBACK_ARTIFACT_DIR=/data/reviews
      # Clones, worktrees, ref comparisons, the git config and per-repo linter installs. Set once, it
      # replaces the relative defaults so nothing resolves onto the read-only rootfs.
      - LAIDBACK_WORK_DIR=/work
      - PI_CODING_AGENT_DIR=/app/.pi/agent
      # Where the review agent lives, and its name: set these in .env rather than baking a machine path
      # into config.yaml.
      - LAIDBACK_AGENT_DIR
      - LAIDBACK_AGENT_NAME
      - LAIDBACK_SKILLS_DIR
      - SLACK_MCP_XOXB_TOKEN
      - SLACK_MCP_XOXC_TOKEN
      - SLACK_MCP_XOXD_TOKEN
    working_dir: /app
    command: ["node", "src/index.mjs"]
    volumes:
      # Configuration and the Pi agent dir the bot owns: models.json for the model provider, agents/
      # for the review agent. Not the host's ~/.pi/agent.
      - type: bind
        source: ${PWD}/config.yaml
        target: /app/config.yaml
        read_only: true
      - type: bind
        source: ${PWD}/.pi/agent
        target: /app/.pi/agent
      # Machine-specific mounts belong in an untracked docker-compose.override.yml next to this file,
      # which compose merges automatically: the host paths of a review agent (${AGENT_DIR_HOST}), a
      # skills checkout (${SKILLS_HOST}), the manifest cache those skills symlink into
      # (${SKILLS_CACHE_HOST}), and a models.json kept outside the repository (${MODELS_JSON_HOST}).
      # They describe this machine, so they are not published with the bot, and the base file runs
      # without them.
      # State, sessions, review records, Go and linter caches.
      - type: bind
        source: ${PWD}/data
        target: /data
      # Cached clones and per-review scratch worktrees.
      - type: bind
        source: ${PWD}/work
        target: /work
    # The model runs on the LAN (127.0.0.1:11182 by default). The bridge network reaches it; if
    # your routing or VPN setup does not, host networking is the fallback.
    # network_mode: host
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - "laidback-reviewer.capabilities=pr:read+write,contents:read,test:run,deploy:none"
