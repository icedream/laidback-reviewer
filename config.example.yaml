# laidback-reviewer configuration. Secrets are environment variables, never values here.
# Unknown keys are rejected at startup.

github:
  me: octocat                       # the username review requests are matched against
  tokenEnv: LAIDBACK_GH_TOKEN     # fine-grained PAT: Pull requests RW, Contents RO, Metadata RO
  orgs: []                          # owners to accept, e.g. [example-corp]; every repo under them
  repos: []                         # owner/name patterns, * for one segment: [example-corp/orders-*]
  deny: []                          # wins over orgs and repos; keeps a repo out even if a list names it
  pollIntervalMs: 120000
  searchAgeHours: 24

trigger:
  mode: review_requested            # review_requested | assigned | both; a request to a team of mine never counts
  policy: any                       # any | human_actor (a person filed it, author irrelevant) | exclude_codeowners
  skipDraft: true

reviews:
  rereviewOnPush: false             # review again when the head moves after the first review
  maxPerCycle: 2
  maxComments: 25
  dryRun: true                      # nothing reaches GitHub; the payload is printed and stored
  approve: hint                     # submit | hint | drop
  requestChanges: hint              # submit | hint | drop
  hintWording:
    approve: "Verdict: I would have approved this."
    requestChanges: "Verdict: I would have requested changes."

banner:
  prefix: ""
  suffix: "<sub>This review was performed by a local AI bot.</sub>"
  rephrase: false                   # rewrite the banner for flow; the review body never goes to that call

agent:
  name: pr-review                   # selects <name>.md; or LAIDBACK_AGENT_NAME
  agentDir: .pi/agent/agents        # or LAIDBACK_AGENT_DIR; ~ is expanded; only README.md is tracked here
  skillsDir: ""                     # read-only skills mount; empty = whatever the agent dir declares; LAIDBACK_SKILLS_DIR in the container
  systemPromptAddendum: ""          # appended after the built-in non-interactive contract
  model:
    provider: local/strata
    id: qwen3.8-flash-next-iq3_s
    thinking: xhigh
    maxConcurrency: 1               # one local inference server, one prompt at a time
    lockFile: ""                    # e.g. /data/inference.lock
    busyBackoffMs: 30000

context:
  enabled: true
  maxAgeDays: 30
  minScore: 35                      # percent, changed-file overlap fallback only
  allowCrossRepo: false             # other repositories, by ticket key only, always digest
  sessionDir: ""                    # empty = nothing persists, so no context carries over
  mode: auto                        # auto | fork | digest
  maxForkTokens: 48000

checkout:
  mode: clone                       # clone | existing (tests point at a prepared tree)
  root: work/repos
  scratch: work/scratch
  existingDir: ""
  goPrivate: ["github.com/example-corp/*"]

toolchain:
  golangciLint: auto                # auto = install what the repo pins | off = image version | v2.3.1 = that tag
  installDir: work/tools            # writable; the image's own copy stays untouched
  preferRepoVersion: true           # false = always use the image's linter
  downloadBaseUrl: https://github.com   # change for a mirror or an air-gapped network

tools:
  bash: true                        # tests, lint, read-only gh subcommands
  mcp: [atlassian]                  # read-only enforced regardless of what the credential allows
  allowHosts:
    - github.com
    - api.github.com
    - raw.githubusercontent.com
    - release-assets.githubusercontent.com   # release downloads redirect here, and every hop is checked
    - mcp.atlassian.com

gate:
  channel: cli                      # slack | cli | none
  beforeReview: false               # hold the task until approved, so no tokens are spent first
  beforePost: true                  # queue the composed review for approval before it is sent
  timeoutHours: 24
  onTimeout: hold                   # hold = never post
  maxPending: 5
  slack:
    transport: userToken            # userToken (xoxc+xoxd) | botToken (xoxb) | webhook (post only, decide with src/cli/gate.mjs)
    channelEnv: LAIDBACK_SLACK_CHANNEL
    channelName: laidback-reviewer-gate
    allowUsersEnv: LAIDBACK_SLACK_USERS
    tokenEnv: SLACK_MCP_XOXC_TOKEN
    cookieEnv: SLACK_MCP_XOXD_TOKEN
    webhookUrlEnv: LAIDBACK_SLACK_WEBHOOK
    reactions:                          # seeded when a different identity will click; Slack names only
      approve: [white_check_mark]
      reject: [x]
      hold: [hourglass_flowing_sand]
    seedReactions: auto                 # auto | always | never (auto skips when the poster may decide)
    apiBaseUrl: https://slack.com/api   # change only for a proxy or a test double
